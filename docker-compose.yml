services:

  # 1. PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: aggregator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO (S3-хранилище)
  minio:
    image: minio/minio:latest
    container_name: aggregator-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Инициализация публичного бакета MinIO
  create-buckets:
    image: minio/mc:latest
    container_name: aggregator-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb myminio/workplace-photos --ignore-existing;
      /usr/bin/mc anonymous set download myminio/workplace-photos;
      exit 0;
      "

  # 4. Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aggregator-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aggregator
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - S3_BUCKET=workplace-photos
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - S3_PUBLIC_URL_PREFIX=http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:9000/workplace-photos/
      - S3_PATH_STYLE_ENABLED=true
    networks:
      - app-network

networks:
  app-network:
    external: true

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local