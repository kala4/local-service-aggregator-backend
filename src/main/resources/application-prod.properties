spring.application.name=aggregator

# Database settings (берем из ENV)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/aggregator}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# JPA & Hibernate
spring.jpa.properties.hibernate.type.prefer_native_enum_types=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=150MB

# Basic Security Admin
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:mySecret123!}
spring.security.user.roles=ADMIN

# JWT Settings
security.jwt.secret=${JWT_SECRET:KzBo5txZb9hS2XVue3X1M2vU0zP5b1bzYzdVZq07JRc=}
security.jwt.ttl=${JWT_TTL:72h}
security.jwt.refresh-threshold=${JWT_REFRESH_THRESHOLD:24h}

# S3 / MinIO Settings
aws.s3.bucket=${S3_BUCKET:workplace-photos}
aws.s3.region=${S3_REGION:us-east-1}
aws.s3.endpoint=${S3_ENDPOINT:http://minio:9000}
aws.s3.access-key=${S3_ACCESS_KEY:minioadmin}
aws.s3.secret-key=${S3_SECRET_KEY:minioadmin}
aws.s3.public-url-prefix=${S3_PUBLIC_URL_PREFIX:http://localhost:9000/workplace-photos/}
aws.s3.path-style-enabled=${S3_PATH_STYLE_ENABLED:true}

# AWS SNS
aws.sns.region=${AWS_SNS_REGION:eu-north-1}
aws.sns.access-key=${AWS_SNS_ACCESS_KEY:}
aws.sns.secret-key=${AWS_SNS_SECRET_KEY:}

server.error.include-message=always